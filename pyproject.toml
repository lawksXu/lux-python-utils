[build-system]
requires = ["setuptools>=84.0.0,<85.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lux-python-utils"
version = "0.1.0"
description = "Python utilities service for Lux"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
